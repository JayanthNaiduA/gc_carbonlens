<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CarbonLens: understand your impact and choose greener.">
  <meta name="theme-color" content="#00865a">
  <title>CarbonLens</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f4f8f5; font-family: system-ui, sans-serif; }
    #loading { min-height: 100vh; display: grid; place-content: center; text-align: center; color: #006b48; }
    #loading p { color: #46594f; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <h1>CarbonLens</h1><p>Preparing your green journey...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
